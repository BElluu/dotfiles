# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Terminal & colors ─────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ── General settings ──────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g mouse on
set -sg escape-time 0
set -g focus-events on
set -g detach-on-destroy off
set -g default-shell /home/linuxbrew/.linuxbrew/bin/zsh
set -g allow-passthrough on
setw -g aggressive-resize on

# ── Alerty: dzwonek ───────────────────────────────────────────────────────────
# Flaga zapala sie tylko w oknach, na ktore nie patrzysz (bell-action other).
setw -g monitor-bell on
set -g bell-action other

# ── Splits ────────────────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"

bind -T root DoubleClick1Border resize-pane -Z

# ── vim-tmux-navigator ────────────────────────────────────────────────────────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# ── Vi copy mode ──────────────────────────────────────────────────────────────
setw -g mode-keys vi
set -g set-clipboard on

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"

# ── Status bar — TOP only ─────────────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify centre
set -g status-style "bg=#1e1e2e"

# Sessions list (left) — rendered by sessions.sh
set -g status-left-length 200
set -g status-left "#(~/.config/tmux/sessions.sh)"

# Windows (centre)
setw -g window-status-format         "#[fg=#585b70,bg=#1e1e2e]  #I:#W#{?window_zoomed_flag,\u00a0\u26f6,}#{?window_bell_flag,#[fg=#f38ba8]\u00a0\u25cf,}  "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold]  #I:#W#{?window_zoomed_flag,\u00a0\u26f6,}  #[fg=#cba6f7,bg=#1e1e2e,nobold]"
setw -g window-status-separator      ""

# Time (right)
set -g status-right-length 60
set -g status-right "#[fg=#585b70,bg=#1e1e2e] %H:%M  %d.%m.%Y "

# ── Pane borders (Catppuccin Mocha) ───────────────────────────────────────────
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-status top
set -g pane-border-format "#[fg=#585b70] #{pane_index}#{?pane_active,#[fg=#89b4fa],} #{pane_current_command} \u00b7 #{=/24/\u2026:#{?#{==:#{pane_title},#{host_short}},#{b:pane_current_path},#{pane_title}}} #{?window_zoomed_flag,#[fg=#f9e2af]\u26f6 ,}"

# Przy 12 panelach 1 s na wybor numeru panelu (C-a q) to za malo
set -g display-panes-time 2000

set -g set-titles on
set -g set-titles-string "#S \u203a #W"

# Reczny tytul panelu (nadpisuje to, co ustawil program)
bind T command-prompt -p "tytul panelu:" "select-pane -T '%%'"

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#cdd6f4,bg=#313244"

# ── Reload config ─────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ── Rozmiar paneli / okna ───────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# ── Nawigacja / układ ──────────────────────────────────────────────────
bind o display-popup -E -w 70% -h 60% "sesh connect \"$(sesh list --icons --hide-duplicates | fzf --ansi --height 100% --reverse --prompt='sesja> ' --border-label=' sesje ')\""
bind O display-popup -E -w 70% -h 60% "tp"
bind s choose-tree -Zs
bind -r ^ switch-client -l
bind b break-pane -d
bind @ choose-window 'join-pane -h -s "%%"'

# ── Popupy ─────────────────────────────────────────────────────────
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind -n M-p display-popup -E -w 80% -h 70% "tmux new-session -A -s scratch"

# Wlasna sciagawka skrotow (nadpisuje domyslne list-keys pod ?)
bind ? display-popup -E -w 84% -h 85% "~/.config/tmux/help.sh"
bind / display-popup -E -w 84% -h 85% "tmux list-keys | less -R"

# ── TPM plugins ───────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# ── Initialize TPM (must be last line) ────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
